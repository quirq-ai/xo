# Not a required check. qq's required check is xo-presubmit (qq-xo-presubmit.yml, generated by
# quirq-ai/infra-config). This adds what qq's builder does not run: the Python Vercel deploys on
# (.python-version), the installed `xo` command, and PRs into branches other than main.
name: presubmit
on:
  pull_request:
permissions:
  contents: read
jobs:
  vercel-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: the installed command runs
        run: |
          xo --version
          xo --help | grep -q 'xo ops'
  windows-self-update:
    # Auto-update on Windows (src/xo/selfupdate.py install_when_free): a running xo.exe cannot be
    # replaced or renamed, so a detached helper waits until no xo runs, then updates.
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/test_selfupdate.py
      - name: the helper waits for a running xo.exe, then updates it
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLERK_SECRET_KEY: sk_test_ci_dummy_not_a_secret
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv "$env:RUNNER_TEMP\v"
          $py = "$env:RUNNER_TEMP\v\Scripts\python.exe"
          $xo = "$env:RUNNER_TEMP\v\Scripts\xo.exe"
          & $py -m pip install --quiet --disable-pip-version-check "quirq-xo @ git+https://github.com/quirq-ai/xo@$env:HEAD_SHA"
          $p = Start-Process -FilePath $xo -ArgumentList 'serve', '--port', '0' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw 'xo serve exited, so nothing held xo.exe' }
          $before = (Get-Item $xo).LastWriteTimeUtc
          $h = Start-Process -FilePath $py -ArgumentList '-I', '-m', 'xo.selfupdate', '--install', $env:HEAD_SHA, '--from', $env:HEAD_SHA -PassThru -WindowStyle Hidden
          $null = $h.Handle
          Start-Sleep -Seconds 8
          if ($h.HasExited) { throw 'the helper did not wait for the running xo.exe' }
          Stop-Process -Id $p.Id
          if (-not $h.WaitForExit(300000)) { throw 'the helper did not finish within 5 minutes' }
          if ($h.ExitCode -ne 0) { Get-Content "$env:USERPROFILE\.config\xo\auto-update.log"; throw 'the update failed' }
          if ((Get-Item $xo).LastWriteTimeUtc -eq $before) { throw 'xo.exe was not rewritten' }
          $v = & $xo --version
          Write-Output $v
          if ($v -ne "xo 0.1.0 ($($env:HEAD_SHA.Substring(0, 7)))") { throw "xo.exe is not the updated xo: $v" }
