# Not a required check. qq's required check is xo-presubmit (qq-xo-presubmit.yml, generated by
# quirq-ai/infra-config). This adds what qq's builder does not run: the Python Vercel deploys on
# (.python-version), the installed `xo` command, and PRs into branches other than main.
name: presubmit
on:
  pull_request:
permissions:
  contents: read
jobs:
  vercel-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: the installed command runs
        run: |
          xo --version
          xo --help | grep -q 'xo ops'
